name: Produce video
on:
  schedule:
    - cron: "0 14 * * 1,4"   # Mon & Thu 14:00 UTC (19:00 Tashkent) -> publishes Tue & Fri 9:00 ET
  workflow_dispatch: {}       # "Run workflow" button for a manual video
permissions:
  contents: write
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter
      - run: pip install -r requirements.txt
      - name: Produce and upload
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python pipeline.py produce
      - name: Remember used topics
        run: |
          git config user.name "logikmedia-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/topics_used.json
          git diff --cached --quiet || (git commit -m "Add produced topic" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-files
          path: out/
          retention-days: 7
