# LogikMedia autopilot settings. Edit freely; no code changes needed.

[channel]
name = "LogikMedia"
niche = "AI tools for US small businesses and freelancers: what they do, what they cost, who should use them, honest pros and cons"
audience = "US small-business owners, solo founders and freelancers who are busy and skeptical of hype"
language = "en"
# Keywords used to look at what is already working on YouTube in the niche.
seed_keywords = [
  "AI tools for small business",
  "AI for freelancers",
  "best AI tools 2026",
  "ChatGPT for small business",
  "AI automation small business",
]
# Words per video narration. ~150 words = 1 minute. 1200 words ≈ 8 min.
target_words = 1200

[schedule]
# Publish slots (US Eastern time). The pipeline picks the next free one.
timezone = "America/New_York"
days = ["Tue", "Fri"]
hour = 9

[review]
# "opt_in"  = video stays private until you press ✅ in Telegram (recommended at start)
# "opt_out" = video is scheduled automatically; press ❌ in Telegram to cancel
# "off"     = no human check (NOT recommended, see README)
mode = "opt_in"

[voice]
# Free default: Microsoft Edge neural voices (edge-tts).
edge_voice = "en-US-AndrewNeural"
edge_rate = "+5%"
# If ELEVENLABS_API_KEY is set, ElevenLabs is used instead (better quality).
elevenlabs_voice_id = "JBFqnCBsd6RMkjVDRZzb"
elevenlabs_model = "eleven_multilingual_v2"

[youtube]
category_id = "28"            # Science & Technology
privacy_after_publish = "public"
made_for_kids = false
playlist_id = ""              # optional: add every video to this playlist
default_tags = ["LogikMedia", "AI tools", "small business", "AI for business"]

[claude]
model = "claude-opus-5-5"
effort = "high"
web_search_max_uses = 8

[brand]
bg = "#0F244E"        # navy (from avatar 1)
bg2 = "#0A1A3A"
accent = "#22D3EE"    # cyan
text = "#FFFFFF"
muted = "#A9B8D6"
