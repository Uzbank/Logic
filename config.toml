# LogikMedia autopilot settings. Edit freely; no code changes needed.

[channel]
name = "LogikMedia"
niche = "AI tools for US small businesses and freelancers: what they do, what they cost, who should use them, honest pros and cons"
audience = "US small-business owners, solo founders and freelancers who are busy and skeptical of hype"
language = "en"
# Keywords used to look at what is already working on YouTube in the niche.
seed_keywords = [
  "AI tools for small business",
  "AI for freelancers",
  "best AI tools 2026",
  "ChatGPT for small business",
  "AI automation small business",
]
# Words per video narration. ~150 words = 1 minute. 1200 words ≈ 8 min.
target_words = 1200

[content]
# "battle" = AI vs AI / prompt vs prompt with real answers on screen (default)
# "explainer" = the older narrated-slides format
format = "battle"

[schedule]
# Publish slots (US Eastern time). The pipeline picks the next free one.
timezone = "America/New_York"
days = ["Tue", "Fri"]
hour = 9

[review]
# "opt_in"  = video stays private until you press ✅ in Telegram (recommended at start)
# "opt_out" = video is scheduled automatically; press ❌ in Telegram to cancel
# "off"     = no human check (NOT recommended, see README)
mode = "opt_in"

[voice]
# Free default: Microsoft Edge neural voices (edge-tts).
edge_voice = "en-US-AndrewNeural"
edge_rate = "+5%"
# If ELEVENLABS_API_KEY is set, ElevenLabs is used instead (better quality).
elevenlabs_voice_id = "JBFqnCBsd6RMkjVDRZzb"
elevenlabs_model = "eleven_multilingual_v2"

[youtube]
category_id = "28"            # Science & Technology
privacy_after_publish = "public"
made_for_kids = false
playlist_id = ""              # optional: add every video to this playlist
default_tags = ["LogikMedia", "AI tools", "small business", "AI for business"]

[claude]
model = "claude-opus-5-5"
effort = "high"
web_search_max_uses = 8

[brand]
bg = "#0F244E"        # navy (from avatar 1)
bg2 = "#0A1A3A"
accent = "#22D3EE"    # cyan
text = "#FFFFFF"
muted = "#A9B8D6"

[battle]
mode = "auto"            # "models", "prompts" or "auto" (writer picks)
target_words = 1000      # narration length (~7 min)
max_contestants = 3

# Cross-company battles: a contestant is used only if its API key secret exists
# (ANTHROPIC_API_KEY / GEMINI_API_KEY / OPENAI_API_KEY). Prices are USD per 1M tokens.
# Model names and prices change often: check them before adding a key.
[[battle.contestants]]
name = "Claude Sonnet 5.5"
provider = "anthropic"
model = "claude-sonnet-5-5"
tag = "Anthropic"
price_in = 2.0
price_out = 10.0

[[battle.contestants]]
name = "Gemini Flash"
provider = "gemini"
model = "gemini-2.5-flash"
tag = "Google"
price_in = 0.30
price_out = 2.50

[[battle.contestants]]
name = "ChatGPT mini"
provider = "openai"
model = "gpt-5-mini"
tag = "OpenAI"
price_in = 0.25
price_out = 2.0

# Used when keys for only one company exist: cheap vs mid vs premium.
[[battle.fallback_contestants]]
name = "Claude Haiku 5.5"
provider = "anthropic"
model = "claude-haiku-5-5"
tag = "Budget model"
price_in = 0.10
price_out = 0.50

[[battle.fallback_contestants]]
name = "Claude Sonnet 5.5"
provider = "anthropic"
model = "claude-sonnet-5-5"
tag = "Mid-range model"
price_in = 2.0
price_out = 10.0

[[battle.fallback_contestants]]
name = "Claude Opus 5.5"
